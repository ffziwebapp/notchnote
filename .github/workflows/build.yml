name: Build NotchNote

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buat installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Simpan installer (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NotchNote-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Baca nomor versi
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Terbitkan rilis
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NotchNote v${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            **Cara memasang:** unduh **NotchNote_${{ steps.ver.outputs.version }}_x64-setup.exe** di bawah, lalu jalankan.
            Kalau muncul "Windows protected your PC", klik **More info** lalu **Run anyway**.

            Tidak perlu Python. Data tersimpan di `%APPDATA%\NotchNote` dan tidak hilang saat memperbarui.
          files: src-tauri/target/release/bundle/nsis/*.exe
