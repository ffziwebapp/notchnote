name: Build NotchNote

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buat installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Simpan installer (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NotchNote-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Baca nomor versi
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Hitung sidik jari (SHA-256)
        id: hash
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "file=$($f.Name)" >> $env:GITHUB_OUTPUT

      - name: Terbitkan rilis
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NotchNote v${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            **Cara memasang:** unduh **NotchNote_${{ steps.ver.outputs.version }}_x64-setup.exe** di bawah, lalu jalankan.
            Kalau muncul "Windows protected your PC", klik **More info** lalu **Run anyway**.

            Tidak perlu Python. Data tersimpan di `%APPDATA%\NotchNote` dan tidak hilang saat memperbarui.

            ### Keamanan
            Installer ini dibuat otomatis oleh GitHub Actions dari kode di repositori ini ([lihat proses build](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            **Sidik jari SHA-256** `${{ steps.hash.outputs.file }}`:
            ```
            ${{ steps.hash.outputs.sha256 }}
            ```
            Cek di PowerShell: `Get-FileHash .\${{ steps.hash.outputs.file }}`. Kalau angkanya sama, file asli dan tidak diubah.

            Periksa dengan ~70 antivirus: buka [virustotal.com](https://www.virustotal.com), tab **URL**, lalu tempel link unduhan installer di bawah. Penjelasan lengkap ada di bagian [Keamanan](https://github.com/${{ github.repository }}#keamanan).
          files: src-tauri/target/release/bundle/nsis/*.exe
