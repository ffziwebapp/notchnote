name: Build NotchNote

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buat installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Simpan installer (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NotchNote-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Terbitkan rilis
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: NotchNote ${{ github.ref_name }}
          body: |
            Unduh **NotchNote_..._x64-setup.exe** di bawah, lalu jalankan.
            Kalau muncul "Windows protected your PC", klik **More info** lalu **Run anyway**.
          files: src-tauri/target/release/bundle/nsis/*.exe
